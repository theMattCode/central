# Local hot-reload development stack (`pnpm dev`).
# Voice services are opt-in through the `voice` profile: `COMPOSE_PROFILES=voice pnpm dev`.
name: ${COMPOSE_PROJECT_NAME:-central-i12e-dev}

services:
  i12e-postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    image: central/i12e-postgres:dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the orchestrator environment file.}
      POSTGRES_DB: ${POSTGRES_DB:-central}
    restart: ${SERVICE_RESTART_POLICY:-no}
    ports:
      - '${POSTGRES_PORT:-3001}:5432'
    volumes:
      - central_i12e-postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  i12e-postgres-migrate:
    image: central/i12e-postgres:dev
    depends_on:
      i12e-postgres:
        condition: service_healthy
    environment:
      PGHOST: i12e-postgres
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:-central}
      PGUSER: ${POSTGRES_USER:-central}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the orchestrator environment file.}
    command: ['apply-migrations.sh']
    restart: 'no'

  service-backend:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: dev
    image: central/service-backend:dev
    depends_on:
      i12e-postgres-migrate:
        condition: service_completed_successfully
    environment:
      BACKEND_PORT: '8080'
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://central:central@i12e-postgres:5432/central}
      BACKEND_CORS_ALLOW_ORIGIN: ${BACKEND_CORS_ALLOW_ORIGIN:-*}
      WEATHER_REFRESH_INTERVAL_SECONDS: ${WEATHER_REFRESH_INTERVAL_SECONDS:-900}
      WEATHER_REQUEST_TIMEOUT_SECONDS: ${WEATHER_REQUEST_TIMEOUT_SECONDS:-10}
      WEATHER_OPEN_METEO_BASE_URL: ${WEATHER_OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
    restart: ${SERVICE_RESTART_POLICY:-no}
    ports:
      - '${BACKEND_PORT:-3010}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m
    volumes:
      - central_backend_cargo_registry:/usr/local/cargo/registry
      - central_backend_cargo_git:/usr/local/cargo/git
      - central_backend_target:/workspace/services/target
    develop:
      watch:
        - action: sync
          path: ../../services/backend/src
          target: /workspace/services/backend/src
        - action: sync
          path: ../../services/backend/Cargo.toml
          target: /workspace/services/backend/Cargo.toml
        - action: rebuild
          path: ../../services/Cargo.toml
        - action: rebuild
          path: ../../services/Cargo.lock
        - action: rebuild
          path: ../../services/backend/Dockerfile

  app-cockpit:
    build:
      context: ../..
      dockerfile: apps/cockpit/Dockerfile
      target: dev
    image: central/app-cockpit:dev
    depends_on:
      service-backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://service-backend:8080}
      ASSISTANT_SERVICE_BASE_URL: ${ASSISTANT_SERVICE_BASE_URL:-http://service-assistant:8080}
      VITE_BACKEND_API_BASE_URL: ${VITE_BACKEND_API_BASE_URL:-http://localhost:${BACKEND_PORT:-3010}}
      VITE_ASSISTANT_API_BASE_URL: ${VITE_ASSISTANT_API_BASE_URL:-http://localhost:${ASSISTANT_PORT:-3020}}
    restart: ${SERVICE_RESTART_POLICY:-no}
    ports:
      - '${COCKPIT_PORT:-3000}:3000'
    develop:
      watch:
        - action: sync
          path: ../../apps/cockpit
          target: /workspace/apps/cockpit
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ../../apps/cockpit/package.json
        - action: rebuild
          path: ../../package.json
        - action: rebuild
          path: ../../pnpm-lock.yaml
        - action: rebuild
          path: ../../apps/cockpit/Dockerfile

  # --- Voice profile -------------------------------------------------------
  # STT, TTS, and the Ollama runtime request `gpus: all` and need Docker GPU
  # support on the host (typically NVIDIA Container Toolkit on Linux).

  service-assistant:
    profiles: [voice]
    build:
      context: ../..
      dockerfile: services/assistant/Dockerfile
      target: dev
    image: central/service-assistant:dev
    environment:
      ASSISTANT_PORT: '8080'
      ASSISTANT_REQUEST_TIMEOUT_SECONDS: ${ASSISTANT_REQUEST_TIMEOUT_SECONDS:-30}
      TTS_STREAM_SOFT_LIMIT_CHARS: ${TTS_STREAM_SOFT_LIMIT_CHARS:-220}
      ASSISTANT_CORS_ALLOW_ORIGIN: ${ASSISTANT_CORS_ALLOW_ORIGIN:-*}
      ASSISTANT_BACKEND_MODE: ${ASSISTANT_BACKEND_MODE:-proxy}
      ASSISTANT_DEFAULT_LANGUAGE: ${ASSISTANT_DEFAULT_LANGUAGE:-de}
      ASSISTANT_DEFAULT_VOICE_INSTRUCTION: ${ASSISTANT_DEFAULT_VOICE_INSTRUCTION:-}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-}
      LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-}
      STT_URL: ${STT_URL:-http://service-stt:8081/transcribe}
      STT_MODEL: ${STT_MODEL:-}
      TTS_URL: ${TTS_URL:-http://service-tts:8082/synthesize}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://service-llm:8083}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    restart: ${SERVICE_RESTART_POLICY:-no}
    ports:
      - '${ASSISTANT_PORT:-3020}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '-', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m
    volumes:
      - central_assistant_cargo_registry:/usr/local/cargo/registry
      - central_assistant_cargo_git:/usr/local/cargo/git
      - central_assistant_target:/workspace/services/target
    develop:
      watch:
        - action: sync
          path: ../../services/assistant/src
          target: /workspace/services/assistant/src
        - action: sync
          path: ../../services/assistant/Cargo.toml
          target: /workspace/services/assistant/Cargo.toml
        - action: rebuild
          path: ../../services/Cargo.toml
        - action: rebuild
          path: ../../services/Cargo.lock
        - action: rebuild
          path: ../../services/assistant/Dockerfile

  service-stt:
    profiles: [voice]
    build:
      context: ../..
      dockerfile: services/stt/Dockerfile
      args:
        STT_ENABLE_GPU: 'true'
    image: central/service-stt:dev
    environment:
      STT_PORT: '8081'
      STT_MODEL: ${STT_MODEL:-small}
      STT_DEVICE: ${STT_DEVICE:-cuda}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-float16}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-5}
      STT_VAD_FILTER: ${STT_VAD_FILTER:-true}
      HF_HOME: ${STT_CACHE_DIR:-/models}
    restart: ${SERVICE_RESTART_POLICY:-no}
    gpus: all
    ports:
      - '${STT_PORT:-3030}:8081'
    volumes:
      - central_stt_models:${STT_CACHE_DIR:-/models}
    healthcheck:
      test:
        ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/healthz").read()']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: sync+restart
          path: ../../services/stt/src
          target: /app/src
        - action: rebuild
          path: ../../services/stt/requirements.txt
        - action: rebuild
          path: ../../services/stt/Dockerfile

  service-tts:
    profiles: [voice]
    build:
      context: ../..
      dockerfile: services/tts/Dockerfile
    image: central/service-tts:dev
    environment:
      TTS_PORT: '8082'
      TTS_MODEL: ${TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      TTS_REFERENCE_AUDIO: ${TTS_REFERENCE_AUDIO:-/app/res/morgan-freeman.mp3}
      TTS_REFERENCE_TEXT_FILE: ${TTS_REFERENCE_TEXT_FILE:-/app/res/morgan-freeman.txt}
      TTS_REFERENCE_TEXT: ${TTS_REFERENCE_TEXT:-}
      TTS_X_VECTOR_ONLY_MODE: ${TTS_X_VECTOR_ONLY_MODE:-false}
      TTS_DEVICE_MAP: ${TTS_DEVICE_MAP:-cuda:0}
      TTS_DTYPE: ${TTS_DTYPE:-bfloat16}
      TTS_ATTENTION_IMPLEMENTATION: ${TTS_ATTENTION_IMPLEMENTATION:-flash_attention_2}
      HF_HOME: ${TTS_CACHE_DIR:-/models/huggingface}
    restart: ${SERVICE_RESTART_POLICY:-no}
    gpus: all
    ports:
      - '${TTS_PORT:-3040}:8082'
    volumes:
      - central_tts_models:/models
    healthcheck:
      test:
        ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8082/healthz").read()']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15m
    develop:
      watch:
        - action: sync+restart
          path: ../../services/tts/src
          target: /app/src
        - action: sync+restart
          path: ../../services/tts/res
          target: /app/res
        - action: rebuild
          path: ../../services/tts/requirements.txt
        - action: rebuild
          path: ../../services/tts/Dockerfile

  service-llm-runtime:
    profiles: [voice]
    image: ${LLM_RUNTIME_IMAGE:-ollama/ollama:latest}
    command: ['serve']
    environment:
      OLLAMA_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-5m}
    restart: ${SERVICE_RESTART_POLICY:-no}
    gpus: all
    ports:
      - '${LLM_RUNTIME_PORT:-3051}:11434'
    volumes:
      - central_llm_models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  service-llm-pull:
    profiles: [voice]
    image: ${LLM_RUNTIME_IMAGE:-ollama/ollama:latest}
    depends_on:
      service-llm-runtime:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://service-llm-runtime:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    command: ['pull', '${LLM_MODEL:-qwen2.5:3b}']
    restart: 'no'

  service-llm:
    profiles: [voice]
    build:
      context: ../..
      dockerfile: services/llm/Dockerfile
    image: central/service-llm:dev
    depends_on:
      service-llm-pull:
        condition: service_completed_successfully
    environment:
      LLM_PORT: '8083'
      LLM_OLLAMA_URL: http://service-llm-runtime:11434
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      LLM_DEFAULT_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    restart: ${SERVICE_RESTART_POLICY:-no}
    ports:
      - '${LLM_PORT:-3050}:8083'
    healthcheck:
      test:
        ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8083/healthz").read()']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: sync+restart
          path: ../../services/llm/src
          target: /app/src
        - action: rebuild
          path: ../../services/llm/requirements.txt
        - action: rebuild
          path: ../../services/llm/Dockerfile

volumes:
  central_i12e-postgres_data:
  central_backend_cargo_registry:
  central_backend_cargo_git:
  central_backend_target:
  central_assistant_cargo_registry:
  central_assistant_cargo_git:
  central_assistant_target:
  central_stt_models:
  central_tts_models:
  central_llm_models:
