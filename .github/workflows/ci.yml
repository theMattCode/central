name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  # One Sentry release per commit, shared by all services.
  SENTRY_RELEASE: central@${{ github.sha }}
  SENTRY_ORG: elyverse-studio

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned Rust toolchain
        working-directory: services
        run: rustup toolchain install

      - run: pnpm install --frozen-lockfile

      - name: Validate all projects
        run: pnpm nx run-many -t format-check lint typecheck test

  prepare:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image-tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject release tag outside main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute image tag
        id: image-tag
        shell: bash
        run: |
          image_tag="sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            image_tag="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::12}"
          fi
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

  build-images:
    name: build-image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - validate
      - prepare
    strategy:
      matrix:
        include:
          - name: app-cockpit
            dockerfile: apps/cockpit/Dockerfile
            context: .
          - name: service-backend
            dockerfile: services/backend/Dockerfile
            context: .
          - name: i12e-postgres
            dockerfile: i12e/postgres/Dockerfile
            context: i12e/postgres
          - name: i12e-gateway
            dockerfile: i12e/gateway/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
          COCKPIT_SENTRY_DSN: ${{ vars.COCKPIT_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          build_args=()
          case "${{ matrix.name }}" in
            app-cockpit)
              build_args+=(--build-arg "VITE_SENTRY_DSN=${COCKPIT_SENTRY_DSN}")
              build_args+=(--build-arg "SENTRY_RELEASE=${SENTRY_RELEASE}")
              build_args+=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
              ;;
            service-backend)
              build_args+=(--build-arg "SENTRY_RELEASE=${SENTRY_RELEASE}")
              ;;
          esac

          image="${REGISTRY}/${IMAGE_NAMESPACE,,}/${{ matrix.name }}:${IMAGE_TAG}"
          docker build "${build_args[@]}" --file "${{ matrix.dockerfile }}" --tag "$image" "${{ matrix.context }}"
          docker push "$image"

  sentry-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - build-images
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Sentry release with commits
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          sentry_cli() {
            npx --yes @sentry/cli@3.8.0 "$@"
          }

          # `--local` reads commits from this checkout, so no Sentry GitHub integration is needed.
          sentry_cli releases new "$SENTRY_RELEASE" \
            --project central-cockpit --project central-backend --project central-assistant
          sentry_cli releases set-commits "$SENTRY_RELEASE" --local --ignore-missing
          sentry_cli releases finalize "$SENTRY_RELEASE"

  test-images-integration:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-images
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test core image set
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
        run: |
          set -euo pipefail

          ci_env_file="$(mktemp)"

          compose_ci() {
            docker compose --env-file "$ci_env_file" --file i12e/orchestrator/deploy/docker-compose.prod.yml "$@"
          }

          cleanup() {
            compose_ci down --volumes --remove-orphans || true
            rm -f "$ci_env_file"
          }

          trap cleanup EXIT

          {
            echo "CENTRAL_VERSION=$IMAGE_TAG"
            echo "COMPOSE_PROJECT_NAME=central-ci-${GITHUB_RUN_ID}"
            echo "SERVICE_RESTART_POLICY=no"
            echo "GATEWAY_BIND=127.0.0.1"
            echo "GATEWAY_PORT=48080"
            echo "CENTRAL_ORIGIN=http://127.0.0.1:48080"
            echo "POSTGRES_USER=central"
            echo "POSTGRES_PASSWORD=central"
            echo "POSTGRES_DB=central"
            echo "BACKEND_DATABASE_URL=postgres://central:central@i12e-postgres:5432/central"
            echo "BACKEND_CORS_ALLOW_ORIGIN=http://127.0.0.1:48080"
            echo "BACKEND_BASE_URL=http://service-backend:8080"
          } > "$ci_env_file"

          compose_ci pull
          compose_ci up --detach --wait i12e-postgres
          compose_ci run --rm i12e-postgres-migrate
          compose_ci up --detach --wait service-backend app-cockpit i12e-gateway
          curl --fail --silent --show-error http://127.0.0.1:48080/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:48080/ >/dev/null
          compose_ci exec -T service-backend wget -qO- http://127.0.0.1:8080/healthz >/dev/null

          compose_ci ps

  publish-images:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - prepare
      - test-images-integration
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
        run: |
          set -euo pipefail

          image_base="${REGISTRY}/${IMAGE_NAMESPACE,,}"
          version_tag="${GITHUB_REF_NAME}"
          stable_tag=false
          if [[ "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable_tag=true
          fi

          publish_image() {
            local image="${image_base}/$1"

            docker pull "${image}:${IMAGE_TAG}"
            docker tag "${image}:${IMAGE_TAG}" "${image}:${version_tag}"
            docker push "${image}:${version_tag}"

            if [ "$stable_tag" = true ]; then
              docker tag "${image}:${IMAGE_TAG}" "${image}:stable"
              docker push "${image}:stable"
            fi
          }

          publish_image app-cockpit
          publish_image service-backend
          publish_image i12e-postgres
          publish_image i12e-gateway

  package-deploy-bundle:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - publish-images
    steps:
      - uses: actions/checkout@v5

      - name: Package deploy bundle
        run: |
          mkdir -p dist
          tar -czf "dist/central-deploy-${GITHUB_REF_NAME}.tar.gz" \
            -C i12e/orchestrator/deploy \
            docker-compose.prod.yml \
            central-update \
            .env.prod.example

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v7
        with:
          name: central-deploy-${{ github.ref_name }}
          path: dist/central-deploy-${{ github.ref_name }}.tar.gz
          retention-days: 1
