[workspace]
resolver = "2"
members = ["assistant", "backend", "observability"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["json", "macros"] }
futures-core = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "http2"] }
sentry = { version = "0.49.3", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
  "tracing",
  "tower-axum-matched-path",
] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

# Line tables let Sentry resolve file and line numbers of release-build stack traces in-process.
[profile.release]
debug = "line-tables-only"
